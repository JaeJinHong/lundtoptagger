signal: top  # top, W, or W_flat; flag to choose one of the configurations below

top:
  weights_file: "/data/jmsardain/LJPTagger/FullSplittings/SplitForTopTagger/flat_weights.root" # not necesary!! 
  pt_hist_file_bkg: "./histos/qcdP8.root" # we should put here all MC samples and if we select all MC or Pythia
  pt_hist_file_signal: "./histos/topBSMP8.root"
  signal_jet_truth_label: 1
  pt_range: [350, 3100]  # jet pT selection in GeV, upper limit not really necessary, in testing jets with pt > 3k are not included
  mass_range: [0, .inf]  # jet mass selection in GeV, for no upper limit use .inf
  min_splits: 3          # minimum number of splittings, or emissions, that jets must have
  skip_dsids:
  - 364700  # don't lose time with jets that don't pass pt cut
  - 364701  # don't lose time with jets that don't pass pt cut
  - 364702  # don't lose time with jets that don't pass pt cut
  - 801859  # don't keep W jets

W:
  weights_file: "/data/jmsardain/LJPTagger/FullSplittings/SplitForTopTagger/flat_weights.root"
  pt_hist_file_bkg: "./histos/qcdP8.root"
  pt_hist_file_signal: "./histos/WBSMP8.root"
  signal_jet_truth_label: 2
  pt_range: [200, 3100]  # jet pT selection in GeV, upper limit not really necessary, in testing jets with pt > 3k are not included
  mass_range: [40, 300]  # mass selection in GeV, for no upper limit use .inf; upper limit can help with stability in ANN
  min_splits: 3          # minimum number of splittings, or emissions, that jets must have
  skip_dsids:
  - 364700  # don't lose time with jets that don't pass pt cut
  - 364701  # don't lose time with jets that don't pass pt cut
  - 364702  # don't lose time with jets that don't pass pt cut
  - 801661  # don't keep top jets

W_flat:
  weights_file: "/data/jmsardain/LJPTagger/FullSplittings/SplitForTopTagger/flat_weights.root"
  pt_hist_file_bkg: "./histos/qcdP8.root"
  pt_hist_file_signal: "./histos/WBSMP8_flat.root"
  signal_jet_truth_label: 2
  pt_range: [200, 3100]   # jet pT selection in GeV, upper limit not really necessary, in testing jets with pt > 3k are not included
  mass_range: [40, 300]   # mass selection in GeV, for no upper limit use .inf
  min_splits: 3          # minimum number of splittings, or emissions, that jets must have
  skip_dsids:
  - 364700  # don't lose time with jets that don't pass pt cut
  - 364701  # don't lose time with jets that don't pass pt cut
  - 364702  # don't lose time with jets that don't pass pt cut
  - 801661  # don't keep top jets
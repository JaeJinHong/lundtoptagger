n_files: null   # choose a small number of files in case you don't want to do full training; set to null to use all files

# The output directory and file name can contain some placeholders inside curly brackets. They will be replaced by the corresponding values:
# {kT_cut} -> value of kT_cut (None if kT_cut is null)
# {include_pt} -> "_with_pt" if include_pt is True, "" if include_pt is False
# {include_dsid} -> "_with_dsid" if include_dsid is True, "" if include_dsid is False
# {include_mcEventWeight} -> "_with_mcEventWeight" if include_mcEventWeight is True, "" if include_mcEventWeight is False
# {test_frac} -> f"_{test_frac*100}percent" if test_frac is not null, "" if test_frac is null
# out_dir: "/home/ravinascos/LundNet/Jad_git/lundtoptagger/Models/"
out_dir: "/data/ravinascos/LundNet/2024_graphs/"
out_file_name: "graphs_QCD{test_frac}_ln_kT_cut_{kT_cut}{include_pt}{include_dsid}{include_mcEventWeight}"
#"LundNet_R22_TRAIN_01QCD_05Z_Primary_FIX_ExtraNode_kt_.0"
# LundNet_R22_TRAIN_01QCD_05Z_Primary_ExtraNode_NormalSignalWeights
test_frac: null   # fraction of jets to save into a separate file for testing, can be null to not save a test file

# selection and output variables to include
kT_cut: 0         # actually a cut in ln(kT), set to null to not apply any cut
include_pt: False            # choose whether to include jet pT as an attribute of the graphs - this is needed for training with the adversarial network and can be useful for evaluation
include_dsid: False          # choose whether to include DSID as an attribute of the graphs, which might be useful for inspecting jets from different QCD contributions
include_mcEventWeight: False # choose whether to include the MC event weight as an attribute of the graphs, which could be used when evaluating the model performance

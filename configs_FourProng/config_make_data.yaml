# path to the configuration file for the signal sample, which contains the selection criteria and other parameters
signal_config_file: "/home/jjhong96/FourProngTagger/LundTopTagger/configs_FourProng/config_signal.yaml"
signal: QCD # SS4W, QCD, WZ, TTbar; flag to choose one of the configurations from the signal_config_file

mass_windows:
  # - [40, 150] # Targetting HH4W
  # - [150, 250] 
  # - [250, 350]
  # - [350, 450]
  # - [450, 550]
  # - [550, 800]
  - [40, 800] # All FourProng signal mass range

jet_label_branch: 'LRJ_nprong' # LRJ_truthLabel, LRJ_nprong, or LRJ_CapturedQuarkCount

ntuple_tag: 'FourProngV1'
jet_class: 'QCD_Train' # jet_classes: HSbbWW_Val  QCD_Train  SS4W_Train  SS4W_Val  TTbar_Train  WZ_Train

path_to_rootfiles: '/data/jjhong96/LundNet_Ntuple/{ntuple_tag}/{jet_class}/*/*.root'

n_files: null      # choose a small number of files in case you don't want to process all files; otherwise set to null
event_fractions: {0.05: 2, 0.1: 9}  # dict of fractions to process sequentially; these will be saved in separate files
# e.g. {0.01: 2, 0.02: 1, ...} - the processing and output files will be divided in 2 chunks of 1% of the events, then 1 chunk of 2% and so on
# to process all events at once, set to {1.0: 1}
# if the fraction is too large, torch.save will fail, e.g. for the JZ4 QCD sample, processing 10% of events at once fails

event_fraction_idx: null  # index of the event_fraction to process (after the dictionary is converted to a list) in case you only want to process one of them
# set to null to process all chunks

# event_factor: 1.0  # factor to multiply the event_fraction by; e.g. if you want to process 10% of events, set to 0.1; if you want to process 50% of events, set to 0.5
# event_factor: 0.04 # Use only 4% of events of the TTBar, WZ samples to keep the jet numbers the same
event_factor: 0.02 # Use only 2% of events of the QCD samples to keep the jet numbers the same


# The output directory and file name can contain some placeholders inside curly brackets.
# They will be replaced by the corresponding values:
# {id} -> value of id specified below
# {kT_cut} -> value of kT_cut (None if kT_cut is null)
# {include_pt} -> "_with_pt" if include_pt is True, "" if include_pt is False
# {frac} -> f"_part{frac_idx}_{event_fraction*100}_percent" if event_fraction < 1.0 else ""; frac_idx is the index of the event_fraction in the list
# out_dir: "/home/ravinascos/LundNet/Jad_git/lundtoptagger/Models/"

graph_tag: "FourProngV1_Split"    # your own identifier for the dataset, used in the output file names
out_dir: "/data/jjhong96/LundNet_Graph/{graph_tag}/mass_{window_low}_{window_high}/"
out_file_name_graphs: "graphs_{jet_class}_{frac}_ln_kT_cut_{kT_cut}{include_pt}"
out_file_name_root: "data_{jet_class}_{frac}_ln_kT_cut_{kT_cut}.root"
# the ROOT file will store mass, pT, mcEventWeight, dsids, truth labels and the flat-pT weights of the jets passing the selection

classification_mode: 'Binary' # Binary or MultiClass

multi_class_N: 4

# can also be set to "all" to calculate multiple flat-pt weights will be calculated for the background jets,
# one for each signal configuration (top, W);
# each one will be saved in a branch/attribute named "fjet_weight_pt_{signal}" in the output ROOT/graphs file
signal_name_in_weight: False  # if True, the flat-pT weight will be saved in a branch/attribute named "fjet_weight_pt_{signal}" in the output ROOT/graphs file
# automatically set to True if if signal is set to "all"
# you can also set it to true even if using only one signal type to have a matching branch/attribute name

# selection and output variables to include as graph attributes
kT_cut: null           # actually a cut in ln(kT), set to null to not apply any cut
include_pt: True       # choose whether to include jet pT as an attribute of the graphs - this is needed for training with the adversarial network and can be useful for evaluation

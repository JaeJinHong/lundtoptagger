# Data and output paths
# =====================
data:
  path_to_trainfiles: "/data/jjhong96/LundNet_Graph/FourProngV2_MultiClassTrain/Shuffled_Graphs_NQuark8_Tight_Iso_FlatPt/train/"  # can also be a list of paths
  path_to_validationfiles: "/data/jjhong96/LundNet_Graph/FourProngV2_MultiClassTrain/Shuffled_Graphs_NQuark8_Tight_Iso_FlatPt/test/"  # can also be a list of paths
  path_to_save: "/data/jjhong96/LundNet_Model/LundNet_GN2X_MultiClass4_FlatPt_Ver2/NQuark8_Tight_Iso/"
  model_name: "LundNet_GN2X_R22_FourClass_NQuark8_Tight_Iso_FlatPt_Ver2"

# Preprocessing is done in Shuffle_data.py

# Architecture and training
# =========================
architecture:
  # batch_size: 4500 #2600
  batch_size: 4096 # 1024 or 4096, depending on VRAM
  test_size: 0.1
  learning_rate: 1.0e-5 # 7.0e-6 or 1.0e-5
  save_every_epoch: True

  # classifier
  n_epochs: 100
  choose_model: LundNet_plus_GN2X_4Class # LundNet, LundNet_plus_GN2X, GATNet, GINNet, EdgeGinNet, PNANet
  # if you want to use LundNet_plus_GN2X, make sure that the graphs have GN2X scores!
  # FourProngV2: LundNet_plus_GN2X_4Class or LundNet4Class

# Computing resources
# ===================

# choose gpu to run on
gpu: null # can be null or integer
# if null, code will check if CUDA is available and use torch.device("cuda") if it is, otherwise torch.device("cpu")
# Usually gpu 4 worked best, it had the most memory available (on UChicago?)

num_workers: 4  # number of workers for the DataLoader, can be set to 0 if you want to use the main thread
